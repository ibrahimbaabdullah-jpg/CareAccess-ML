[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careaccess-ml"
version = "0.1.0"
description = "Appointment no-show risk research workbench and capacity-limited outreach planner."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Pinned runtime dependencies (including the PyTorch CPU index) live in
# requirements.txt; install with `pip install -r requirements-dev.txt`.
dependencies = []

[tool.setuptools]
packages = ["careaccess"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["careaccess"]

[tool.ruff]
target-version = "py312"
line-length = 120
# scripts/research is a frozen, hash-recorded research protocol kept as published.
extend-exclude = [".venv", "scripts/research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# The compact multi-statement style is being unpacked in a separate refactor.
ignore = ["E701", "E702", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["careaccess"]
