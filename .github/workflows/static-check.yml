name: Frozen browser demo static verification

on:
  push:
    branches: [research-browser-demo]
  pull_request:
    branches: [research-browser-demo]

permissions:
  contents: read

jobs:
  static-check:
    name: static-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify frozen static assets and model structure
        run: python3 scripts/verify_static.py
